name: Format Release Changelogs

on:
  push:
    branches: [main]
    paths:
      - 'src/content/changelog/**'

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Auto-format release changelog') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run prettier on changelog
        run: npx prettier --write 'src/content/changelog/**'

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain src/content/changelog/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/changelog/
            git commit -m "Auto-format release changelog"
            git push
          else
            echo "No formatting changes needed."
          fi
